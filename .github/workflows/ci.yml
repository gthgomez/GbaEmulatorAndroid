name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build + unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The app's native build compiles the core engine in from
      # $GBA_EMULATOR_ROOT. The core pin lives in core.lock.json (single
      # source of truth, currently a36ebb19 — the state-hash hot-path fix);
      # tools/bootstrap-core.py fetches exactly that commit and verifies it.
      - name: Bootstrap core engine from core.lock.json
        id: core
        run: |
          echo "path=$(python3 tools/bootstrap-core.py --dest "$GITHUB_WORKSPACE/deps/GBA_Emulator")" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Add preinstalled sdkmanager to PATH
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platforms;android-36" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run unit tests
        env:
          GBA_EMULATOR_ROOT: ${{ steps.core.outputs.path }}
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
